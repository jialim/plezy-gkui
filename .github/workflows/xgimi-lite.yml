name: XGIMI Lite Android

on:
  push:
    branches: [plezy-xgimi-lite]
    tags: ['xgimi-lite-*']
  pull_request:
    branches: [plezy-xgimi-lite]
  workflow_dispatch:
    inputs:
      build_label:
        description: Artifact suffix (for example test2)
        default: test1
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'
  # SHA-256 of the permanent XGIMI Lite signing certificate (Test 4 onward).
  # Publishing is refused for any APK signed with something else, so every
  # release installs over the previous one without an uninstall.
  XGIMI_CERT_SHA256: ebf36e62002238ae5e3d2cccb8fdd233c9a467e428bee5e377430e5871a7f3d0

concurrency:
  group: xgimi-lite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The release tag, file names and the in-app updater all key off this,
      # so it comes from pubspec.yaml instead of a second hand-kept copy.
      - name: Read XGIMI version
        shell: bash
        run: |
          full=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "XGIMI_VERSION=${full%%+*}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Install wakelock_plus development dependencies
        working-directory: packages/wakelock_plus
        run: flutter pub get --enforce-lockfile --no-example

      - name: Analyze
        run: dart run scripts/checks/check_analyzer.dart

      # The profile edits shared code (focus, theme, track and version
      # selection), so the whole upstream suite must still pass.
      - name: Upstream tests
        run: flutter test

      - name: Verify XGIMI logic
        run: >-
          flutter test
          test/media/media_version_family_projector_test.dart
          test/services/family_projector_subtitle_test.dart
          test/services/family_projector_subtitle_selection_test.dart
          test/services/family_projector_ui_test.dart
          test/services/external_player_service_test.dart
          test/services/update_service_test.dart
          test/focus/focusable_action_bar_test.dart
          test/utils/update_dialog_test.dart
          test/widgets/player_exit_confirmation_test.dart
          test/widgets/family_language_gate_test.dart
          --dart-define=FAMILY_PROJECTOR_MODE=true

      # Branch releases and manual builds use the permanent key so every build
      # updates in place. Pull requests and tag pushes build unreviewed code and
      # publish a public artifact, so they never receive the key: even a
      # same-repository pull request gets an isolated throwaway key.
      - name: Configure APK signing
        shell: bash
        env:
          USE_PERMANENT_KEY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/plezy-xgimi-lite') || github.event_name == 'workflow_dispatch' }}
          XGIMI_KEYSTORE_BASE64: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/plezy-xgimi-lite') || github.event_name == 'workflow_dispatch') && secrets.XGIMI_KEYSTORE_BASE64 || '' }}
          XGIMI_KEYSTORE_PASSWORD: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/plezy-xgimi-lite') || github.event_name == 'workflow_dispatch') && secrets.XGIMI_KEYSTORE_PASSWORD || '' }}
          XGIMI_KEY_ALIAS: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/plezy-xgimi-lite') || github.event_name == 'workflow_dispatch') && secrets.XGIMI_KEY_ALIAS || '' }}
          XGIMI_KEY_PASSWORD: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/plezy-xgimi-lite') || github.event_name == 'workflow_dispatch') && secrets.XGIMI_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/plezy-xgimi-lite" ]; then
            for name in XGIMI_KEYSTORE_BASE64 XGIMI_KEYSTORE_PASSWORD XGIMI_KEY_ALIAS XGIMI_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is required for XGIMI branch releases; refusing to publish with a disposable key."
                exit 1
              fi
            done
          fi

          if [ -n "$XGIMI_KEYSTORE_BASE64" ]; then
            if [ -z "$XGIMI_KEYSTORE_PASSWORD" ] || [ -z "$XGIMI_KEY_ALIAS" ]; then
              echo "::error::The XGIMI signing secret set is incomplete."
              exit 1
            fi
            printf '%s' "$XGIMI_KEYSTORE_BASE64" | base64 -d > android/app/xgimi-test-keystore.jks
            store_password="$XGIMI_KEYSTORE_PASSWORD"
            key_alias="$XGIMI_KEY_ALIAS"
            key_password="${XGIMI_KEY_PASSWORD:-$XGIMI_KEYSTORE_PASSWORD}"
          else
            echo "::notice::Signing with a throwaway key (USE_PERMANENT_KEY=$USE_PERMANENT_KEY). This APK cannot update an installed XGIMI Lite."
            store_password=android
            key_alias=xgimi-test
            key_password=android
            keytool -genkeypair -noprompt \
              -keystore android/app/xgimi-test-keystore.jks \
              -storepass "$store_password" \
              -alias "$key_alias" \
              -keypass "$key_password" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Plezy XGIMI Lite Test,O=Plezy,C=MY'
          fi
          cat > android/key.properties <<EOF
          storePassword=$store_password
          keyPassword=$key_password
          keyAlias=$key_alias
          storeFile=xgimi-test-keystore.jks
          EOF

      - name: Android updater and native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -x :app:compileFlutterBuildDebug --continue

      - name: Build ARM APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --dart-define=FAMILY_PROJECTOR_MODE=true
          '--dart-define=FAMILY_PROJECTOR_NAME=Plezy XGIMI Lite'
          --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Remove test signing key
        if: always()
        run: rm -f android/app/xgimi-test-keystore.jks android/key.properties

      - name: Name sideload artifacts
        shell: bash
        env:
          INPUT_LABEL: ${{ inputs.build_label }}
        run: |
          label="${INPUT_LABEL:-sha-${GITHUB_SHA::7}}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-armeabi-v7a.apk"
          tar -czf "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-arm64-v8a.tar.gz" "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-arm64-v8a.apk"
          tar -czf "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-armeabi-v7a.tar.gz" "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-armeabi-v7a.apk"
          # Confirm the package identity, so a regression to upstream's
          # com.edde746.plezy cannot ship and collide with official Plezy.
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt" dump badging "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-arm64-v8a.apk" | grep -q "package: name='app.plezylite.xgimi'" \
            || { echo "::error::The APK does not use the app.plezylite.xgimi package ID."; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-xgimi-lite-android
          if-no-files-found: error
          path: |
            plezy-xgimi-lite-*.apk
            plezy-xgimi-lite-*.tar.gz
          retention-days: 30

  # Every change merged to the branch is published as the next test
  # pre-release, so the projector always has a downloadable APK for it.
  release:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/plezy-xgimi-lite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read XGIMI version
        shell: bash
        run: |
          full=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "XGIMI_VERSION=${full%%+*}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plezy-xgimi-lite-android
          path: dist

      - name: Publish test pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_WITH_STABLE_KEY: ${{ secrets.XGIMI_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          prefix="xgimi-lite-v${XGIMI_VERSION}-test"
          last=$(git tag --list "${prefix}*" | sed "s/^${prefix}//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          number=$(( ${last:-0} + 1 ))
          tag="${prefix}${number}"
          label="test${number}"

          current_build=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f2)
          if [ -n "$last" ]; then
            previous_build=$(git show "${prefix}${last}:pubspec.yaml" | sed -n 's/^version: *//p' | cut -d+ -f2)
            if [ "$current_build" -le "$previous_build" ]; then
              echo "::error::Increase the pubspec build number before publishing an update."
              exit 1
            fi
          fi

          cd dist
          for file in *; do
            mv "$file" "${file/sha-${GITHUB_SHA::7}/$label}"
          done
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in *.apk; do
            if ! "$apksigner" verify --print-certs "$apk" | grep -qi "certificate SHA-256 digest: ${XGIMI_CERT_SHA256}"; then
              echo "::error::$apk is not signed with the permanent XGIMI Lite key; refusing to publish."
              exit 1
            fi
          done
          arm64_sha=$(sha256sum *-arm64-v8a.apk | cut -d' ' -f1)
          armv7_sha=$(sha256sum *-armeabi-v7a.apk | cut -d' ' -f1)
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          arm64_code=$("$aapt" dump badging *-arm64-v8a.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          armv7_code=$("$aapt" dump badging *-armeabi-v7a.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test -n "$arm64_code" && test -n "$armv7_code"
          cd ..

          if [ -n "$last" ]; then
            changes=$(git log --no-merges --format='- %s' "${prefix}${last}..HEAD")
          else
            changes=$(git log -1 --format='- %s')
          fi
          if [ "$SIGNED_WITH_STABLE_KEY" = true ]; then
            signing="Signed with the permanent XGIMI Lite key as package app.plezylite.xgimi. Builds that used com.edde746.plezy install this as a separate app once; later builds update in place."
          else
            signing="Signed with a throwaway test key. Uninstall the previous Plezy build before installing this one."
          fi

          cat > notes.md <<NOTES
          ## Changes

          ${changes}

          ## Downloads

          - **armeabi-v7a**: use this for the confirmed 32-bit XGIMI projector
          - **arm64-v8a**: for other devices with confirmed 64-bit userspace

          The \`.tar.gz\` files contain the same APKs for download environments that block APK files.

          ## Verification

          GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          - Source commit: ${GITHUB_SHA}
          - arm64 APK SHA-256: \`${arm64_sha}\`
          - armv7 APK SHA-256: \`${armv7_sha}\`
          - arm64 APK version code: ${arm64_code}
          - armv7 APK version code: ${armv7_code}

          ${signing}
          NOTES

          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Plezy XGIMI Lite ${XGIMI_VERSION} Test ${number}" \
            --notes-file notes.md \
            --prerelease

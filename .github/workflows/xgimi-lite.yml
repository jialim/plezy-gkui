name: XGIMI Lite Android

on:
  push:
    branches: [plezy-xgimi-lite]
    tags: ['xgimi-lite-*']
  pull_request:
    branches: [plezy-xgimi-lite]
  workflow_dispatch:
    inputs:
      build_label:
        description: Artifact suffix (for example test2)
        default: test1
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'
  XGIMI_VERSION: '2.22.0'

concurrency:
  group: xgimi-lite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Install wakelock_plus development dependencies
        working-directory: packages/wakelock_plus
        run: flutter pub get --enforce-lockfile --no-example

      - name: Analyze
        run: dart run scripts/checks/check_analyzer.dart

      # The profile edits shared code (focus, theme, track and version
      # selection), so the whole upstream suite must still pass.
      - name: Upstream tests
        run: flutter test

      - name: Verify XGIMI logic
        run: >-
          flutter test
          test/media/media_version_family_projector_test.dart
          test/services/family_projector_subtitle_test.dart
          test/services/family_projector_subtitle_selection_test.dart
          test/services/family_projector_ui_test.dart
          --dart-define=FAMILY_PROJECTOR_MODE=true

      # Branch releases must use the permanent key so every build from Test 4
      # onward updates in place. Pull requests can use an isolated throwaway
      # key because repository secrets are intentionally unavailable to forks.
      - name: Configure APK signing
        shell: bash
        env:
          XGIMI_KEYSTORE_BASE64: ${{ secrets.XGIMI_KEYSTORE_BASE64 }}
          XGIMI_KEYSTORE_PASSWORD: ${{ secrets.XGIMI_KEYSTORE_PASSWORD }}
          XGIMI_KEY_ALIAS: ${{ secrets.XGIMI_KEY_ALIAS }}
          XGIMI_KEY_PASSWORD: ${{ secrets.XGIMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/plezy-xgimi-lite" ]; then
            for name in XGIMI_KEYSTORE_BASE64 XGIMI_KEYSTORE_PASSWORD XGIMI_KEY_ALIAS XGIMI_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is required for XGIMI branch releases; refusing to publish with a disposable key."
                exit 1
              fi
            done
          fi

          if [ -n "$XGIMI_KEYSTORE_BASE64" ]; then
            if [ -z "$XGIMI_KEYSTORE_PASSWORD" ] || [ -z "$XGIMI_KEY_ALIAS" ]; then
              echo "::error::The XGIMI signing secret set is incomplete."
              exit 1
            fi
            printf '%s' "$XGIMI_KEYSTORE_BASE64" | base64 -d > android/app/xgimi-test-keystore.jks
            store_password="$XGIMI_KEYSTORE_PASSWORD"
            key_alias="$XGIMI_KEY_ALIAS"
            key_password="${XGIMI_KEY_PASSWORD:-$XGIMI_KEYSTORE_PASSWORD}"
          else
            echo "::warning::XGIMI_KEYSTORE_BASE64 is not set; signing with a throwaway key. Uninstall the previous build before installing this one."
            store_password=android
            key_alias=xgimi-test
            key_password=android
            keytool -genkeypair -noprompt \
              -keystore android/app/xgimi-test-keystore.jks \
              -storepass "$store_password" \
              -alias "$key_alias" \
              -keypass "$key_password" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Plezy XGIMI Lite Test,O=Plezy,C=MY'
          fi
          cat > android/key.properties <<EOF
          storePassword=$store_password
          keyPassword=$key_password
          keyAlias=$key_alias
          storeFile=xgimi-test-keystore.jks
          EOF

      - name: Build ARM APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --dart-define=FAMILY_PROJECTOR_MODE=true
          '--dart-define=FAMILY_PROJECTOR_NAME=Plezy XGIMI Lite'
          --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Remove test signing key
        if: always()
        run: rm -f android/app/xgimi-test-keystore.jks android/key.properties

      - name: Name sideload artifacts
        shell: bash
        env:
          INPUT_LABEL: ${{ inputs.build_label }}
        run: |
          label="${INPUT_LABEL:-sha-${GITHUB_SHA::7}}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-armeabi-v7a.apk"
          tar -czf "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-arm64-v8a.tar.gz" "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-arm64-v8a.apk"
          tar -czf "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-armeabi-v7a.tar.gz" "plezy-xgimi-lite-${XGIMI_VERSION}-${label}-armeabi-v7a.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-xgimi-lite-android
          if-no-files-found: error
          path: |
            plezy-xgimi-lite-*.apk
            plezy-xgimi-lite-*.tar.gz
          retention-days: 30

  # Every change merged to the branch is published as the next test
  # pre-release, so the projector always has a downloadable APK for it.
  release:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/plezy-xgimi-lite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plezy-xgimi-lite-android
          path: dist

      - name: Publish test pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_WITH_STABLE_KEY: ${{ secrets.XGIMI_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          prefix="xgimi-lite-v${XGIMI_VERSION}-test"
          last=$(git tag --list "${prefix}*" | sed "s/^${prefix}//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          number=$(( ${last:-0} + 1 ))
          tag="${prefix}${number}"
          label="test${number}"

          cd dist
          for file in *; do
            mv "$file" "${file/sha-${GITHUB_SHA::7}/$label}"
          done
          arm64_sha=$(sha256sum *-arm64-v8a.apk | cut -d' ' -f1)
          armv7_sha=$(sha256sum *-armeabi-v7a.apk | cut -d' ' -f1)
          cd ..

          if [ -n "$last" ]; then
            changes=$(git log --no-merges --format='- %s' "${prefix}${last}..HEAD")
          else
            changes=$(git log -1 --format='- %s')
          fi
          if [ "$SIGNED_WITH_STABLE_KEY" = true ]; then
            signing="Signed with the permanent XGIMI Lite key. In-place updates are supported from Test 4 onward; Tests 1-3 used unrelated disposable keys."
          else
            signing="Signed with a throwaway test key. Uninstall the previous Plezy build before installing this one."
          fi

          cat > notes.md <<NOTES
          ## Changes

          ${changes}

          ## Downloads

          - **arm64-v8a**: try this first on most XGIMI projectors
          - **armeabi-v7a**: use only if the arm64 APK does not install

          The \`.tar.gz\` files contain the same APKs for download environments that block APK files.

          ## Verification

          GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          - Source commit: ${GITHUB_SHA}
          - arm64 APK SHA-256: \`${arm64_sha}\`
          - armv7 APK SHA-256: \`${armv7_sha}\`

          ${signing}
          NOTES

          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Plezy XGIMI Lite ${XGIMI_VERSION} Test ${number}" \
            --notes-file notes.md \
            --prerelease

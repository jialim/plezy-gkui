name: GKUI checks

on:
  push:
    branches:
      - gkui/**
      - claude/**
  pull_request:
  workflow_dispatch:

jobs:
  gkui:
    name: API 19 build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/main_gkui.dart lib/gkui test/gkui

      - name: Analyze GKUI code
        run: flutter analyze lib/main_gkui.dart lib/gkui test/gkui

      - name: Flutter tests
        run: flutter test test/gkui

      # Checks never see the car's signing key: they run for every branch and
      # pull request, and their APK artifact is public. Only gkui-release.yml
      # signs with the real certificate.
      - name: Configure throwaway APK signing
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/gkui-ci.jks"
          keytool -genkeypair -noprompt \
            -keystore "$key_path" \
            -storepass android \
            -alias gkui-ci \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Plezy GKUI CI,O=Plezy,C=MY'
          echo "GKUI_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "GKUI_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "GKUI_KEY_ALIAS=gkui-ci" >> "$GITHUB_ENV"
          echo "GKUI_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      # The release build runs lintVitalRelease, where NewApi is fatal, so an
      # API 20+ framework call fails here instead of on the head unit.
      - name: Build API 19 ARMv7 APK
        run: flutter build apk --release --target-platform android-arm --target lib/main_gkui.dart

      - name: Remove signing key
        if: always()
        run: if [ -n "${GKUI_KEYSTORE_PATH:-}" ]; then rm -f "$GKUI_KEYSTORE_PATH"; fi

      - name: Android unit tests
        working-directory: android
        # -Ptarget keeps the Flutter debug compile on the GKUI entry point;
        # the default lib/main.dart is dormant upstream code that does not build.
        run: ./gradlew :app:testDebugUnitTest -Ptarget=lib/main_gkui.dart -Ptarget-platform=android-arm --no-daemon

      - name: Upload APK (throwaway-signed, does not update the car)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-gkui-apk-ci-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

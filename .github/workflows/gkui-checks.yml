name: GKUI checks

on:
  push:
    branches:
      - gkui/**
      - claude/**
  pull_request:
  workflow_dispatch:

jobs:
  gkui:
    name: API 19 build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/main_gkui.dart lib/gkui test/gkui

      - name: Analyze GKUI code
        run: flutter analyze lib/main_gkui.dart lib/gkui test/gkui

      - name: Flutter tests
        run: flutter test test/gkui

      - name: Configure APK signing
        shell: bash
        env:
          GKUI_KEYSTORE_BASE64: ${{ secrets.GKUI_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.GKUI_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.GKUI_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.GKUI_KEY_PASSWORD }}
        run: |
          key_path="$RUNNER_TEMP/gkui-release.jks"
          if [ -n "$GKUI_KEYSTORE_BASE64" ]; then
            : "${SECRET_STORE_PASSWORD:?GKUI_KEYSTORE_PASSWORD is required}"
            : "${SECRET_KEY_ALIAS:?GKUI_KEY_ALIAS is required}"
            printf '%s' "$GKUI_KEYSTORE_BASE64" | base64 -d > "$key_path"
            store_password="$SECRET_STORE_PASSWORD"
            key_alias="$SECRET_KEY_ALIAS"
            key_password="${SECRET_KEY_PASSWORD:-$SECRET_STORE_PASSWORD}"
          else
            echo "::warning::GKUI signing secrets are unavailable; using a throwaway CI key."
            store_password=android
            key_alias=gkui-ci
            key_password=android
            keytool -genkeypair -noprompt \
              -keystore "$key_path" \
              -storepass "$store_password" \
              -alias "$key_alias" \
              -keypass "$key_password" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Plezy GKUI CI,O=Plezy,C=MY'
          fi
          echo "GKUI_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "GKUI_KEYSTORE_PASSWORD=$store_password" >> "$GITHUB_ENV"
          echo "GKUI_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
          echo "GKUI_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"

      # The release build runs lintVitalRelease, where NewApi is fatal, so an
      # API 20+ framework call fails here instead of on the head unit.
      - name: Build API 19 ARMv7 APK
        run: flutter build apk --release --target-platform android-arm --target lib/main_gkui.dart

      - name: Remove signing key
        if: always()
        run: if [ -n "${GKUI_KEYSTORE_PATH:-}" ]; then rm -f "$GKUI_KEYSTORE_PATH"; fi

      - name: Android unit tests
        working-directory: android
        # -Ptarget keeps the Flutter debug compile on the GKUI entry point;
        # the default lib/main.dart is dormant upstream code that does not build.
        run: ./gradlew :app:testDebugUnitTest -Ptarget=lib/main_gkui.dart -Ptarget-platform=android-arm --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-gkui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
